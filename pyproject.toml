[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bleepy"
version = "0.1.0"
description = "A simple foul language filter for Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "TBD" }
keywords = ["profanity", "filter", "foul language", "censorship", "text"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Filters",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/vikh-ram/bleepy"
Repository = "https://github.com/vikh-ram/bleepy"
Issues = "https://github.com/vikh-ram/bleepy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bleepy*"]
